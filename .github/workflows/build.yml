name: Build PotionSkill
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q PotionSkill-source.zip
      - run: cd PotionSkill && mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: PotionSkill-jar
          path: PotionSkill/target/PotionSkill-*.jar
